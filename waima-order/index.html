<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>歪马送酒 × 冰力达门店下单</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#edf8ff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;color:#102a43}.app{max-width:760px;margin:0 auto;padding:14px 14px 134px}.hero{background:linear-gradient(135deg,#075fc0,#12b8ff);border-radius:24px;padding:20px 16px;color:#fff;box-shadow:0 14px 34px rgba(0,91,180,.22);overflow:hidden;position:relative}.hero:after{content:"";position:absolute;right:-45px;top:-45px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.16)}.brand{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:12px}.kicker{font-size:13px;font-weight:900;opacity:.95}.hero h1{font-size:26px;line-height:1.15;margin:10px 0 8px}.hero p{margin:0;font-size:14px}.wm-logo{flex:0 0 auto;background:#ffd400;color:#111;border-radius:14px;padding:10px 13px;font-weight:900;text-align:center;line-height:1.05;box-shadow:0 6px 14px rgba(0,0,0,.12)}.notice{margin-top:12px;background:#fff7d6;color:#7a4b00;border:1px solid #ffe08a;padding:10px 12px;border-radius:14px;font-size:14px;font-weight:800}.section-title{font-weight:900;color:#073b78;font-size:18px;margin:18px 2px 10px}.form{background:#fff;border-radius:18px;padding:12px;box-shadow:0 8px 24px rgba(0,65,130,.08)}.form input,.form textarea{width:100%;border:1px solid #cfe7ff;background:#f7fbff;border-radius:12px;padding:12px;margin:6px 0;font-size:15px;outline:none}.form textarea{height:72px;resize:none}.grid{display:grid;gap:12px}.card{display:grid;grid-template-columns:116px 1fr;gap:12px;align-items:center;background:#fff;border:1px solid #d8ecff;border-radius:20px;padding:12px;box-shadow:0 8px 24px rgba(0,65,130,.08)}.photo{width:116px;height:116px;border-radius:18px;background:linear-gradient(145deg,#f8fdff,#e7f6ff);border:1px solid #dbefff;display:flex;align-items:center;justify-content:center;overflow:hidden}.pack{position:relative;width:78px;height:100px;background:#fff;border:2px solid #58aeea;border-radius:12px;box-shadow:0 6px 12px rgba(0,78,150,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.pack:before{content:"冰力达";position:absolute;top:8px;left:0;right:0;color:#0967c8;font-size:13px;font-weight:900}.pack:after{content:"食用冰";position:absolute;bottom:8px;left:12px;right:12px;background:#ffd400;color:#063b78;border-radius:999px;font-size:11px;font-weight:900}.pack .main{font-size:18px;font-weight:900;color:#0967c8;margin-top:12px}.pack .sub{font-size:10px;color:#4b6b86;margin-top:2px}.cup{border-radius:16px 16px 24px 24px;width:72px;height:98px}.cup:after{content:"冰杯"}.moon{width:84px;height:84px;border-radius:18px;background:#fff;border:2px solid #ffcc33}.moon:before{content:"月球冰";top:16px;color:#064f9e}.moon:after{content:"140g";bottom:14px}.lemon{border-color:#66c36a}.lemon:before{content:"柠檬风味";color:#1f9d55}.lemon:after{content:"冻饮";background:#b8f7b5;color:#176b35}.bag1{height:104px;width:82px}.name{font-size:17px;font-weight:900;color:#102a43;margin-bottom:4px}.meta{font-size:13px;color:#587089;line-height:1.45}.price{font-size:15px;color:#0967c8;font-weight:900;margin-top:5px}.ops{display:flex;align-items:center;gap:8px;margin-top:10px}.btn{width:40px;height:40px;border:0;border-radius:12px;background:#0b67c8;color:#fff;font-size:26px;font-weight:900;line-height:1}.qty{width:58px;height:40px;border:2px solid #ffd400;border-radius:12px;background:#fff7d6;text-align:center;font-size:18px;font-weight:900;color:#123}.subtotal{margin-left:auto;font-size:15px;color:#1f9d55;font-weight:900;white-space:nowrap}.fixed{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-top:1px solid #dceeff;box-shadow:0 -8px 24px rgba(0,65,130,.12);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:99}.fixed-inner{max-width:760px;margin:0 auto}.summary{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:15px;font-weight:800;color:#073b78}.summary strong{color:#f59e0b;font-size:20px}.warn{font-size:13px;margin:5px 0 8px;font-weight:900;color:#d97706}.ok{color:#1f9d55}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.primary,.secondary{height:44px;border-radius:999px;font-size:16px;font-weight:900}.primary{border:0;background:#0b67c8;color:#fff}.secondary{background:#eef8ff;color:#0b67c8;border:1px solid #9cd0ff}.order-box{display:none;background:#fff;border-radius:18px;margin-top:14px;padding:12px;border:1px solid #cfe7ff;box-shadow:0 8px 24px rgba(0,65,130,.08)}.order-box textarea{width:100%;height:190px;border:0;outline:none;background:#f7fbff;border-radius:12px;padding:10px;font-size:14px;line-height:1.55}.copy-btn{width:100%;height:44px;border:0;border-radius:999px;background:#1f9d55;color:#fff;font-weight:900;font-size:16px;margin-top:10px}.footer{text-align:center;color:#0b67c8;font-weight:900;font-size:14px;margin-top:18px}@media(max-width:430px){.app{padding:12px 10px 138px}.card{grid-template-columns:96px 1fr;padding:10px;gap:10px}.photo{width:96px;height:96px}.pack{transform:scale(.86)}.name{font-size:16px}.ops{gap:6px}.btn{width:36px;height:36px}.qty{width:48px;height:36px}.subtotal{font-size:13px}}
</style>
</head>
<body>
<div class="app">
<section class="hero"><div class="brand"><div><div class="kicker">冰力达食用冰系列</div><h1>歪马送酒门店下单</h1></div><div class="wm-logo">歪马<br>送酒</div></div><p>5件起送｜可混搭｜适配酒饮、即饮、聚会消费场景</p></section>
<div class="notice">操作方式：选择产品数量 → 生成订单文字 → 复制后发到微信群。具体订购请联系群内@一米阳光。</div>
<div class="section-title">门店信息</div>
<section class="form"><input id="store" placeholder="门店名称"><input id="contact" placeholder="联系人"><input id="phone" placeholder="联系电话" inputmode="tel"><textarea id="address" placeholder="配送地址 / 备注"></textarea></section>
<div class="section-title">选择产品</div><section class="grid" id="products"></section>
<section class="order-box" id="orderBox"><textarea id="orderText" readonly></textarea><button class="copy-btn" onclick="copyOrder()">复制订单文字发微信群</button></section>
<div class="footer">具体订购请联系群内@一米阳光</div>
</div>
<div class="fixed"><div class="fixed-inner"><div class="summary"><div>合计：<strong id="totalQty">0</strong> 件</div><div>金额：<strong id="totalAmount">¥0.00</strong></div></div><div class="warn" id="status">未满5件，暂不可下单</div><div class="actions"><button class="primary" onclick="generateOrder()">生成订单</button><button class="secondary" onclick="resetOrder()">清零重选</button></div></div></div>
<script>
const products=[{n:'220g食用冰杯',s:'220g×24杯/件',u:'2.65元/杯',p:63.6,v:'cup'},{n:'70月球冰',s:'140g×12颗×4/件',u:'14.4元/组',p:144,v:'moon'},{n:'1kg食用冰袋',s:'1kg×10袋/件',u:'5.9元/袋',p:59,v:'bag1'},{n:'160g柠檬冰杯',s:'160g×24杯/件',u:'3.95元/杯',p:94.8,v:'cup lemon'},{n:'160g食用冰袋',s:'160g×48袋/件',u:'1.5元/袋',p:72,v:'bag1'}];
const state=products.map(()=>0);function money(n){return'¥'+Number(n).toFixed(2)}
function render(){document.getElementById('products').innerHTML=products.map((p,i)=>`<article class="card"><div class="photo"><div class="pack ${p.v}"><div class="main">${p.n.includes('1kg')?'1kg':p.n.includes('160g')?'160g':p.n.includes('70')?'70':'220g'}</div><div class="sub">${p.s}</div></div></div><div><div class="name">${p.n}</div><div class="meta">规格：${p.s}</div><div class="meta">单价：${p.u}</div><div class="price">单件价：${money(p.p)}</div><div class="ops"><button class="btn" onclick="changeQty(${i},-1)">−</button><input class="qty" id="qty-${i}" type="number" min="0" value="${state[i]}" oninput="setQty(${i},this.value)"><button class="btn" onclick="changeQty(${i},1)">+</button><div class="subtotal" id="sub-${i}">${money(state[i]*p.p)}</div></div></div></article>`).join('');update()}
function changeQty(i,d){state[i]=Math.max(0,state[i]+d);document.getElementById('qty-'+i).value=state[i];update()}function setQty(i,v){let n=parseInt(v||'0',10);state[i]=Math.max(0,isNaN(n)?0:n);update()}function totals(){let q=0,a=0;state.forEach((x,i)=>{q+=x;a+=x*products[i].p});return{q,a}}
function update(){let t=totals();document.getElementById('totalQty').innerText=t.q;document.getElementById('totalAmount').innerText=money(t.a);let s=document.getElementById('status');s.innerText=t.q>=5?'已满足5件起送，可提交订单':'未满5件，暂不可下单';s.className=t.q>=5?'warn ok':'warn';state.forEach((q,i)=>{let e=document.getElementById('sub-'+i);if(e)e.innerText=money(q*products[i].p)})}
function generateOrder(){let t=totals();if(t.q<5){alert('未满5件起送，请继续选择产品数量。');return}let store=document.getElementById('store').value.trim(),contact=document.getElementById('contact').value.trim(),phone=document.getElementById('phone').value.trim(),addr=document.getElementById('address').value.trim();let lines=['【歪马送酒门店订货】'];if(store)lines.push('门店名称：'+store);if(contact||phone)lines.push('联系人：'+contact+(phone?'，电话：'+phone:''));if(addr)lines.push('配送地址/备注：'+addr);lines.push('','订货明细：');state.forEach((q,i)=>{if(q>0)lines.push(`${products[i].n}：${q}件 × ${money(products[i].p)} = ${money(q*products[i].p)}`)});lines.push('',`合计件数：${t.q}件`,`合计金额：${money(t.a)}`,'具体订购请联系群内@一米阳光');document.getElementById('orderText').value=lines.join('\n');document.getElementById('orderBox').style.display='block';document.getElementById('orderBox').scrollIntoView({behavior:'smooth',block:'center'})}
async function copyOrder(){let text=document.getElementById('orderText').value;if(!text)return;try{await navigator.clipboard.writeText(text);alert('订单文字已复制，可以粘贴到微信群。')}catch(e){let box=document.getElementById('orderText');box.select();document.execCommand('copy');alert('订单文字已复制，可以粘贴到微信群。')}}function resetOrder(){state.fill(0);document.getElementById('orderBox').style.display='none';document.getElementById('orderText').value='';render()}render();
</script>
</body></html>

ucts[i].p)})}function generateOrder(){let t=totals();if(t.q<5){alert('未满5件起送，请继续选择产品数量。');return}let store=document.getElementById('store').value.trim(),contact=document.getElementById('contact').value.trim(),phone=document.getElementById('phone').value.trim(),addr=document.getElementById('address').value.trim();let lines=['【歪马送酒门店订货】'];if(store)lines.push('门店名称：'+store);if(contact||phone)lines.push('联系人：'+contact+(phone?'，电话：'+phone:''));if(addr)lines.push('配送地址/备注：'+addr);lines.push('','订货明细：');state.forEach((q,i)=>{if(q>0)lines.push(`${products[i].n}：${q}件 × ${money(products[i].p)} = ${money(q*products[i].p)}`)});lines.push('',`合计件数：${t.q}件`,`合计金额：${money(t.a)}`,'具体订购请联系群内@一米阳光');document.getElementById('orderText').value=lines.join('\n');document.getElementById('orderBox').style.display='block';document.getElementById('orderBox').scrollIntoView({behavior:'smooth',block:'center'})}async function copyOrder(){let text=document.getElementById('orderText').value;if(!text)return;try{await navigator.clipboard.writeText(text);alert('订单文字已复制，可以粘贴到微信群。')}catch(e){let box=document.getElementById('orderText');box.select();document.execCommand('copy');alert('订单文字已复制，可以粘贴到微信群。')}}function resetOrder(){state.fill(0);document.getElementById('orderBox').style.display='none';document.getElementById('orderText').value='';render()}render();</script></body></html>
